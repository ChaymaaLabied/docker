# version: "3.8"

services:

  database:
    image: mysql:8
    container_name: database
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: projetdb
    ports:
      - "3306:3306"
    networks:
      - reseau-bridge
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: database
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: projetdb
    depends_on:
      database:
        condition: service_healthy
    networks:
      - reseau-bridge

  nginx:
    image: nginx:alpine
    container_name: frontend
    ports:
      - "8082:80"
    depends_on:
      - backend
    networks:
      - reseau-bridge

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - "8081:8080"
    networks:
      - reseau-bridge

networks:
  reseau-bridge: